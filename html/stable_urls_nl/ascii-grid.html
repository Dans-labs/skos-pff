<p>Het is aan te bevelen om Grid-bestanden zoveel mogelijk om te zetten naar ASCII-tekst. Het mag van GIS-applicaties verwacht worden dat zij ASCII-grid bestanden correct kunnen importeren.</p>
<p>ASCII GRID is een preferred format binnen bestandstype <a data-wpel-link="external" href="https://dans.knaw.nl/bestandsformaten/raster-gis/" rel="external noopener noreferrer" target="_blank">raster GIS</a>.</p>
